# Butterfly 主题配置（覆盖项，其余使用主题默认值）
# 文档: https://butterfly.js.org/

nav:
  logo:
  display_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  关于: /about/ || fas fa-user

social:
  fab fa-github: https://github.com/neocwei || Github 主页

index_site_info:
index_top_img_height:

# 首页不显示大图，保持简洁
index_img:
default_top_img: false

# 文章内嵌 HTML（B 站 iframe）需要保留
skip_render:

# 深色模式：默认黑色，保留切换按钮
darkmode:
  enable: true
  button: true
  autoChangeMode: false

footer:
  owner:
    enable: true
    since: 2025
  custom_text:
